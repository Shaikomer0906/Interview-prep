<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interview Prep Coach - Chat</title>
  <style>
    :root {
      --bg: #f4f1e8;
      --card: #fffaf0;
      --ink: #1d2a38;
      --muted: #51606f;
      --accent: #c95f2d;
      --accent-2: #1f7a6d;
      --line: #e8dcc7;
      --ok: #245d42;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Space Grotesk", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 15%, #ffd6a5 0%, #ffd6a500 32%),
        radial-gradient(circle at 85% 20%, #b8f2e6 0%, #b8f2e600 30%),
        linear-gradient(145deg, #f8f6ef 0%, #efe5d4 100%);
      display: grid;
      place-items: start center;
      padding: 20px;
    }

    .app {
      width: min(900px, 100%);
      height: 90vh;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 20px 45px #1d2a3816;
      display: flex;
      flex-direction: column;
      animation: rise 450ms ease-out;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hero {
      padding: 20px 24px;
      background: linear-gradient(120deg, #1d2a38 0%, #2f3f52 100%);
      color: #fff;
    }

    .hero h1 {
      margin: 0 0 4px;
      font-size: 1.5rem;
      letter-spacing: 0.2px;
    }

    .hero p {
      margin: 0;
      color: #deebff;
      font-size: 0.9rem;
    }

    .setup {
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
      background: #fff;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    input[type="text"],
    button {
      font: inherit;
      border-radius: 12px;
      border: 1px solid var(--line);
      padding: 12px 14px;
    }

    input[type="text"] {
      width: 100%;
      color: var(--ink);
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent-2);
      box-shadow: 0 0 0 3px #1f7a6d24;
    }

    button {
      cursor: pointer;
      border: none;
      color: #fff;
      background: linear-gradient(120deg, var(--accent), #d9783a);
      font-weight: 600;
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px #c95f2d35;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .questions-section {
      padding: 20px;
      border-bottom: 1px solid var(--line);
      background: #f9f7f2;
      max-height: 200px;
      overflow-y: auto;
    }

    .questions-title {
      margin: 0 0 12px;
      font-weight: 700;
      font-size: 0.95rem;
      color: #152230;
    }

    .question-item {
      margin: 0 0 8px;
      padding: 8px 12px;
      background: #fff;
      border-left: 3px solid var(--accent-2);
      border-radius: 6px;
      font-size: 0.9rem;
      color: #1f4d46;
      line-height: 1.4;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      display: flex;
      gap: 10px;
      animation: slideIn 300ms ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      justify-content: flex-end;
    }

    .message-bubble {
      max-width: 70%;
      padding: 12px 14px;
      border-radius: 12px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .message.user .message-bubble {
      background: linear-gradient(120deg, var(--accent), #d9783a);
      color: #fff;
      border-radius: 12px 4px 12px 12px;
    }

    .message.coach .message-bubble {
      background: #f0f8f6;
      color: var(--ink);
      border: 1px solid #c9e6df;
      border-radius: 4px 12px 12px 12px;
    }

    .input-area {
      padding: 16px 20px;
      border-top: 1px solid var(--line);
      background: #fff;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    input[type="text"].chat-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      color: var(--ink);
      font-size: 0.95rem;
    }

    input[type="text"].chat-input:focus {
      outline: none;
      border-color: var(--accent-2);
      box-shadow: 0 0 0 3px #1f7a6d24;
    }

    .button-send {
      padding: 12px 20px;
      white-space: nowrap;
    }

    .status {
      margin: 0;
      color: var(--ok);
      font-size: 0.92rem;
      font-weight: 600;
      padding: 0 20px;
      margin-top: 8px;
    }

    .initial-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
    }

    .initial-state p {
      color: var(--muted);
      font-size: 1rem;
      margin: 0;
    }

    .loading {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.5s infinite;
      margin-left: 8px;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    @media (max-width: 760px) {
      .setup {
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
      }

      .message-bubble {
        max-width: 100%;
      }

      .chat-container {
        height: auto;
      }

      .app {
        height: auto;
        min-height: 100vh;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="hero">
      <h1>Interview Preparation Coach</h1>
      <p>AI-powered coaching with multi-turn conversation support</p>
    </header>

    <section class="setup">
      <input
        id="jobTitleInput"
        type="text"
        placeholder="Enter job title (e.g., Senior Backend Engineer, Data Scientist)..."
      />
      <button id="startBtn">Start Interview</button>
    </section>

    <div class="chat-container">
      <div class="initial-state" id="initialState">
        <p>Enter a job title and click "Start Interview" to begin</p>
      </div>

      <div class="questions-section" id="questionsSection" style="display: none;">
        <div class="questions-title">📋 Interview Questions</div>
        <div id="questionsList"></div>
      </div>

      <div class="chat-messages" id="chatMessages" style="display: none;"></div>

      <div class="input-area" id="inputArea" style="display: none;">
        <input
          id="userInput"
          type="text"
          class="chat-input"
          placeholder="Ask a follow-up question or request clarification..."
        />
        <button id="sendBtn" class="button-send">Send</button>
      </div>

      <p class="status" id="status"></p>
    </div>
  </main>

  <script>
    const jobTitleInput = document.getElementById('jobTitleInput');
    const startBtn = document.getElementById('startBtn');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const chatMessages = document.getElementById('chatMessages');
    const inputArea = document.getElementById('inputArea');
    const initialState = document.getElementById('initialState');
    const questionsSection = document.getElementById('questionsSection');
    const questionsList = document.getElementById('questionsList');
    const status = document.getElementById('status');

    let sessionId = Math.random().toString(36).substring(7);
    let currentRole = 'general';
    let started = false;

    // Generate unique session ID
    function generateSessionId() {
      return `session_${Date.now()}_${Math.random().toString(36).substring(7)}`;
    }

    sessionId = generateSessionId();

    // Start interview session
    async function startInterview() {
      const title = jobTitleInput.value.trim();
      if (!title) {
        status.textContent = '❌ Please enter a job title';
        return;
      }

      startBtn.disabled = true;
      status.textContent = '⏳ Loading questions...';

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ jobTitle: title, sessionId })
        });

        const data = await response.json();
        if (response.ok) {
          currentRole = data.roleKey;
          started = true;

          // Display initial questions
          initialState.style.display = 'none';
          questionsSection.style.display = 'block';
          chatMessages.style.display = 'flex';
          inputArea.style.display = 'grid';

          // Show questions
          questionsList.innerHTML = data.questions
            .map((q, i) => `<div class="question-item"><strong>Q${i + 1}:</strong> ${q.question}</div>`)
            .join('');

          // Add welcome message from coach
          addMessage(
            `Welcome to your interview coaching session! I'm your ${data.roleKey} interview coach. I've prepared 5 realistic questions for a "${title}" role. You can ask me follow-up questions, request clarification, or ask for tips on how to answer any of these. What would you like to focus on first?`,
            'coach'
          );

          status.textContent = '✅ Ready! Ask any follow-up questions below';
          jobTitleInput.disabled = true;
          userInput.focus();
        } else {
          status.textContent = `❌ ${data.error || 'Failed to generate questions'}`;
        }
      } catch (error) {
        console.error('Error:', error);
        status.textContent = '❌ Connection error. Check console for details.';
      } finally {
        startBtn.disabled = false;
      }
    }

    // Send chat message
    async function sendMessage() {
      const message = userInput.value.trim();
      if (!message || !started) return;

      addMessage(message, 'user');
      userInput.value = '';
      sendBtn.disabled = true;
      status.textContent = '⏳ Coach thinking...';

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            userMessage: message,
            sessionId,
            role: currentRole
          })
        });

        const data = await response.json();
        if (response.ok) {
          addMessage(data.response, 'coach');
          status.textContent = '✅ Coach response received';
        } else {
          addMessage(`Error: ${data.error || 'Failed to get response'}`, 'coach');
          status.textContent = '❌ Error getting response';
        }
      } catch (error) {
        console.error('Error:', error);
        addMessage('Connection error. Could not reach the coach.', 'coach');
        status.textContent = '❌ Connection error';
      } finally {
        sendBtn.disabled = false;
        userInput.focus();
      }
    }

    // Add message to chat
    function addMessage(text, role) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${role}`;

      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      bubble.textContent = text;

      msgDiv.appendChild(bubble);
      chatMessages.appendChild(msgDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // Event listeners
    startBtn.addEventListener('click', startInterview);
    jobTitleInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !started) startInterview();
    });

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && started && !sendBtn.disabled) sendMessage();
    });
  </script>
</body>
</html>
